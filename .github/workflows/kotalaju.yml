# Membuat APK Android KotaLaju secara otomatis setiap ada perubahan kode aplikasi.
# APK diterbitkan di halaman Releases repo ini, lalu bisa diunduh dari
#   https://kotalaju.netlify.app/kotalaju.apk   (dialihkan oleh netlify.toml)
# Situs web tetap diterbitkan oleh Netlify (lihat netlify.toml).
name: Build APK Android

on:
  push:
    branches: [main]
    paths:
      - 'kotalaju/**'
      - '.github/workflows/kotalaju.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotalaju
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Pasang dependensi
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Beri nama file
        run: cp build/app/outputs/flutter-apk/app-release.apk kotalaju.apk

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: KotaLaju Android (build ${{ github.run_number }})
          make_latest: true
          files: kotalaju/kotalaju.apk
          body: |
            APK KotaLaju untuk HP Android.
            Unduh langsung: https://kotalaju.netlify.app/kotalaju.apk
            Cara pasang: buka file APK → izinkan "Instal dari sumber tidak dikenal" → Instal.
